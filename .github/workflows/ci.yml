name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  lint:
    name: fmt + clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --locked --all-targets --all-features -- -D warnings

  test:
    name: unit tests (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --locked

  integration:
    name: integration tests (Redis + Valkey in Docker)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Pull images
        run: docker pull redis:7.4-alpine && docker pull valkey/valkey:8.1-alpine
      - run: cargo test --locked --features integration-tests --tests

  integration-redis-6-2:
    name: integration tests (Redis 6.2)
    runs-on: ubuntu-latest
    env:
      REDIS_LENS_IT_REDIS_IMAGE: redis:6.2-alpine
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Pull images
        run: docker pull redis:6.2-alpine && docker pull valkey/valkey:8.1-alpine
      - run: cargo test --locked --features integration-tests --tests

  msrv:
    name: MSRV (1.89)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.89
      - uses: Swatinem/rust-cache@v2
      - run: cargo check --locked --all-features

  package:
    name: cargo package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo package --locked

  demo:
    name: demo environment comes up
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker compose -f demo/compose.yml up -d --wait redis valkey
      - run: docker compose -f demo/compose.yml run --rm seed
      - name: Keys were seeded
        run: |
          n=$(docker compose -f demo/compose.yml exec -T redis redis-cli --user admin --pass admin-demo-only --no-auth-warning DBSIZE)
          echo "redis keys: $n"
          test "$n" -gt 50000
      - if: always()
        run: docker compose -f demo/compose.yml down -v
