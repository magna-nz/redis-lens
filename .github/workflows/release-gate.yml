name: Release gate

# The checks a release must pass before anything is built or published. The Release
# workflow (release.yml, generated by dist) calls this as a plan job (see `plan-jobs` in
# dist-workspace.toml): every build job waits for it, and the hand-edited `host` job
# (search release.yml for HAND-EDITED) refuses to publish unless it passed.
#
# Only Release calls it; it has no push or pull_request trigger of its own, so it never
# runs alongside CI. `plan` is optional and unused: dist passes it to every custom job,
# and an undeclared input is a hard error, so it is declared and ignored.
on:
  workflow_call:
    inputs:
      plan:
        required: false
        type: string

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

# Every job skips on pull requests. dist runs the Release workflow on every pull request
# as a dry run (`dist plan` and builds, never a publish), and CI already runs these checks
# there; without the `if:` each pull request would run them twice. In a called workflow
# `github.event_name` is the caller's event: 'pull_request' on a pull request, 'push' on a
# `v*` tag. A skipped job counts as passed for the caller, which is fine on a pull
# request because nothing is published there.
jobs:
  lint:
    name: fmt + clippy
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --locked --all-targets --all-features -- -D warnings

  test:
    name: unit tests (${{ matrix.os }})
    if: github.event_name != 'pull_request'
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --locked

  integration:
    name: integration tests (${{ matrix.redis }} + Valkey in Docker)
    if: github.event_name != 'pull_request'
    strategy:
      fail-fast: false
      matrix:
        redis: ["redis:7.4-alpine", "redis:6.2-alpine"]
    runs-on: ubuntu-latest
    env:
      REDIS_LENS_IT_REDIS_IMAGE: ${{ matrix.redis }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # The same images ci.yml pulls, so a slow pull does not count against a test.
      - name: Pull images
        run: docker pull "$REDIS_LENS_IT_REDIS_IMAGE" && docker pull valkey/valkey:8.1-alpine && docker pull linuxserver/openssh-server:10.3_p1-r2-ls243
      - run: cargo test --locked --features integration-tests --tests
