[package]
name = "redis-lens"
version = "0.1.0"
edition = "2024"
rust-version = "1.89"
description = "A terminal UI that shows what's using memory in Redis and Valkey: key patterns, TTL hygiene, snapshot diffs and hot keys."
license = "MIT OR Apache-2.0"
repository = "https://github.com/magna-nz/redis-lens"
readme = "README.md"
keywords = ["redis", "valkey", "tui", "memory", "profiler"]
categories = ["command-line-utilities", "database", "development-tools::profiling"]
exclude = ["/demo", "/.github", "/CLAUDE.md", "/Makefile", "/spec.md", "/status.md", "/docs"]

[features]
default = []
# Sign in to Azure Cache for Redis / Azure Managed Redis with Microsoft Entra ID.
entra-id = ["redis/entra-id"]
# Integration tests that start Redis and Valkey containers. Needs Docker.
integration-tests = []

[dependencies]
anyhow = "1.0.104"
bollard = "0.21.1"
clap = { version = "4.6.7", features = ["derive", "env"] }
crossterm = "0.29.0"
directories = "6.0.0"
futures = "0.3.34"
keyring = "4.2.0"
ratatui = "0.30.2"
redis = { version = "1.8.1", default-features = false, features = [
    "acl",
    "aio",
    "tokio-comp",
    "tokio-rustls-comp",
    "tls-rustls-webpki-roots",
    "cluster-async",
    "connection-manager",
    "script",
] }
rpassword = "7.5.4"
secrecy = "0.10.3"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1"
thiserror = "2.0.21"
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros", "time", "sync", "signal", "net"] }
toml = "1.2.1"
url = "2.5.8"

[dev-dependencies]
insta = "1.49.0"
proptest = "1.12.0"
testcontainers = "0.28.0"
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros", "time"] }

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
dbg_macro = "warn"
print_stderr = "allow"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
