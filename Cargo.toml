[package]
name = "redis-lens"
version = "0.1.0"
edition = "2024"
rust-version = "1.89"
description = "A terminal UI that shows what's using memory in Redis and Valkey: key patterns, TTL hygiene, snapshot diffs and hot keys."
license = "MIT OR Apache-2.0"
repository = "https://github.com/magna-nz/redis-lens"
readme = "README.md"
keywords = ["redis", "valkey", "tui", "memory", "profiler"]
categories = ["command-line-utilities", "database", "development-tools::profiling"]
exclude = ["/demo", "/.github", "/CLAUDE.md", "/Makefile", "/spec.md", "/status.md", "/docs"]

[features]
default = []
# Sign in to Azure Cache for Redis / Azure Managed Redis with Microsoft Entra ID.
entra-id = ["redis/entra-id"]
# Integration tests that start Redis and Valkey containers. Needs Docker.
integration-tests = []

[dependencies]
anyhow = "1.0.104"
base64 = "0.22.1"
bollard = "0.21.1"
clap = { version = "4.6.7", features = ["derive", "env"] }
crossterm = "0.29.0"
directories = "6.0.0"
# Values (src/value/): gzip and zlib through the pure-Rust miniz_oxide backend.
flate2 = { version = "1.1.11", default-features = false, features = ["rust_backend"] }
futures = "0.3.34"
keyring = "4.2.0"
# Values: LZ4 frame decoding only, the safe and bounds-checked decoder.
lz4_flex = { version = "0.14.0", default-features = false, features = ["frame", "safe-decode", "checked-decode"] }
ratatui = "0.30.2"
# Pinned on purpose: src/conn/tls.rs relies on redis-rs 1.8.1 *replacing* its default
# trust store with the one in `tls_params` (`root_cert_store.unwrap_or(root_store)` in
# connection.rs `create_rustls_config`), not merging the two. A unit test there
# (`redis_is_still_the_version_whose_store_handling_was_checked`) fails when Cargo.lock
# moves off 1.8.1: re-check that function, then update the pin in the test.
redis = { version = "1.8.1", default-features = false, features = [
    "acl",
    "aio",
    "tokio-comp",
    "tokio-rustls-comp",
    # Keep: redis-rs builds its default store on every TLS connection, even when
    # `tls_params` replace it. Without this feature that default is the OS store, loaded
    # again per connection and failing if any one certificate is unreadable. With it, the
    # default is the bundled webpki roots, which costs nothing. src/conn/tls.rs always
    # passes its own store (OS certificates, or webpki-root-certs below), so the default
    # is only a fallback that is not expected to be reached.
    "tls-rustls-webpki-roots",
    "cluster-async",
    "connection-manager",
    "script",
] }
rmpv = "1.3.1"
rpassword = "7.5.4"
rustls = { version = "0.23.46", default-features = false, features = ["std"] }
rustls-native-certs = "0.8.5"
# Values: pure-Rust zstd decoder.
ruzstd = "0.9.1"
# The bundled roots as full certificates (webpki-roots only has trust anchors, and
# redis-rs takes custom roots only as PEM). Same CCADB data and version as the
# webpki-roots that redis-rs pulls in. webpki-roots is used to leave out the roots it
# limits with name constraints, which a certificate cannot carry (src/conn/tls.rs).
webpki-root-certs = "1.0.9"
webpki-roots = "1.0.9"
secrecy = "0.10.3"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = { version = "1", features = ["float_roundtrip"] }
thiserror = "2.0.21"
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros", "time", "sync", "signal", "net"] }
toml = "1.2.1"
unicode-width = "0.2.3"
url = "2.5.8"

[dev-dependencies]
insta = "1.49.0"
# The value tests compress their fixtures.
lz4_flex = { version = "0.14.0", default-features = false, features = ["frame", "safe-encode"] }
proptest = "1.12.0"
rcgen = { version = "0.14", default-features = false, features = ["ring", "pem", "x509-parser"] }
testcontainers = "0.28.0"
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros", "time", "io-util", "test-util"] }
# The in-process TLS server in tests/os_trust.rs. Same version redis-rs uses.
tokio-rustls = { version = "0.26.6", default-features = false }

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
dbg_macro = "warn"
print_stderr = "allow"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
