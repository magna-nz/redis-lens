<title>redis-lens: open the dashboard from the terminal</title>

<body>
<main class="locked">
<div class="card locked-card">
<div class="brand">
<img src="assets/mark.svg" alt="" width="30" height="30">
<span class="brand-name">redis-lens</span>
</div>
<h1>This page opens from redis-lens</h1>
<p>Open the dashboard from redis-lens: press <span class="kbd">ctrl-o</span> in the terminal, or run <span class="kbd">redis-lens --dashboard</span>.</p>
<p class="muted">The dashboard is served only to this computer, and only to a browser that redis-lens opened. A copied address without that step shows this page instead.</p>

</main>
