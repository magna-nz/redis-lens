<!doctype html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="dark light">
<meta name="referrer" content="no-referrer">
<title>redis-lens</title>
<link rel="icon" href="assets/mark.svg" type="image/svg+xml">
<link rel="stylesheet" href="assets/app.css">
<script type="module" src="assets/app.js"></script>
</head>
<body>
<div class="app" id="app">
<a class="skip" href="#main">Skip to the content</a>

<header class="topbar">
<div class="brand" id="brand">
<img src="assets/mark.svg" alt="" width="24" height="24">
<span class="brand-name">redis-lens</span>
</div>
<div class="ctx" id="ctx">
<div class="menu-wrap">
<button class="btn ctx-btn" id="conn-btn" type="button" aria-haspopup="true" aria-expanded="false" aria-controls="conn-menu">
<span class="dot" aria-hidden="true"></span>
<span>Not connected</span>
<span class="caret" aria-hidden="true">▾</span>
</button>
<div class="menu" id="conn-menu" hidden></div>
</div>
<button class="btn ctx-btn" id="access-btn" type="button" data-act="writes" hidden></button>
<div class="menu-wrap" id="db-wrap" hidden>
<button class="btn ctx-btn" id="db-btn" type="button" data-act="db" aria-haspopup="true" aria-expanded="false" aria-controls="db-menu">
<span class="mono" id="db-label">db 0</span>
<span class="caret" aria-hidden="true">▾</span>
</button>
<div class="menu" id="db-menu" hidden></div>
</div>
<div class="node-pick" id="node-wrap" hidden>
<label for="node-select">Node</label>
<select class="field mono" id="node-select"></select>
</div>
</div>
<form class="find" id="find-form" role="search" autocomplete="off">
<button class="goto-box" id="goto-btn" type="button" aria-haspopup="dialog" data-act="goto" aria-label="Go to: a pattern, a key, a screen or an action; find keys by name">
<svg class="icon" aria-hidden="true" focusable="false" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M11 4a7 7 0 1 0 0 14a7 7 0 0 0 0-14zM20 20l-3.5-3.5"></path></svg>
<span class="goto-ph">Go to: a pattern, key, screen or action</span>
</button>
</form>
<div class="topbar-end">
<span class="badge sample" id="sample-badge" hidden title="Invented servers for trying the page out: nothing here comes from Redis or Valkey">Sample data</span>
<div class="seg" id="live-seg">
<button class="btn" id="live-toggle" type="button" data-act="live" disabled>
<span class="dot" aria-hidden="true"></span>
<span id="live-label">Live</span>
</button>
<label class="sr-only" for="poll-interval">How often the live figures are read</label>
<select class="field" id="poll-interval" disabled></select>
</div>
<button class="btn icon-btn" id="keys-btn" type="button" data-act="sheet" aria-haspopup="dialog" aria-label="Keys: the keys of this screen">?</button>
<button class="btn icon-btn" id="theme-toggle" type="button" aria-label="Switch to the light theme">
<svg class="icon" aria-hidden="true" focusable="false" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 8a4 4 0 1 0 0 8a4 4 0 0 0 0-8zM12 2v2M12 20v2M4 12H2M22 12h-2M5 5l1.5 1.5M17.5 17.5L19 19M5 19l1.5-1.5M17.5 6.5L19 5"></path></svg>
</button>
</div>
</header>

<div class="shell">

<nav class="nav" aria-label="Areas">
<a class="navb" href="#/overview" data-nav="overview" aria-keyshortcuts="1" data-hint="1">
<svg class="icon" aria-hidden="true" focusable="false" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 4h7v7H4zM13 4h7v7h-7zM4 13h7v7H4zM13 13h7v7h-7z"></path></svg>
<span>Overview</span>
</a>
<a class="navb" href="#/browse" data-nav="browse" aria-keyshortcuts="2" data-hint="2">
<svg class="icon" aria-hidden="true" focusable="false" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 6h16M4 12h16M4 18h10"></path></svg>
<span>Browse</span>
</a>
<a class="navb" href="#/analyze" data-nav="analyze" aria-keyshortcuts="3" data-hint="3">
<svg class="icon" aria-hidden="true" focusable="false" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 20V10M12 20V4M19 20v-7"></path></svg>
<span>Analyze</span>
</a>
<a class="navb" href="#/server" data-nav="server" aria-keyshortcuts="4" data-hint="4">
<svg class="icon" aria-hidden="true" focusable="false" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12h4l3-8 4 16 3-8h4"></path></svg>
<span>Server</span>
</a>
<a class="navb" href="#/pubsub" data-nav="pubsub" aria-keyshortcuts="5" data-hint="5">
<svg class="icon" aria-hidden="true" focusable="false" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12a7 7 0 0 1 14 0M8.5 12a3.5 3.5 0 0 1 7 0M12 12v8"></path></svg>
<span>Pub/Sub</span>
</a>
<div class="nav-sep" role="presentation"></div>
<a class="navb" href="#/connections" data-nav="connections" aria-keyshortcuts="0" data-hint="0">
<svg class="icon" aria-hidden="true" focusable="false" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 3v6M15 3v6M6 9h12v3a6 6 0 0 1-12 0zM12 18v3"></path></svg>
<span>Connections</span>
</a>
<button class="navb" id="cmd-toggle" type="button" aria-expanded="false" aria-controls="cmdline" aria-keyshortcuts=":" data-hint=":">
<svg class="icon" aria-hidden="true" focusable="false" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 6l6 6-6 6M12 18h8"></path></svg>
<span>Command line</span>
</button>
</nav>

<main class="main" id="main" tabindex="-1">
<div class="main-inner">
<div id="banner"></div>
<div id="view">
<noscript><div class="card"><p>The dashboard needs JavaScript. It runs only code served by redis-lens on this computer.</p></div></noscript>
</div>
</div>
<section class="cmd-drawer" id="cmdline" aria-label="Command line" hidden></section>
</main>

</div>
</div>
<div class="toasts" id="toasts" role="status" aria-live="polite"></div>
</body>
</html>
